name: CI

on:
  # Every job runs exactly once per commit: pull_request covers branch work,
  # push covers main itself (post-merge, and any direct commit). Widening
  # push to '**' would double every job for the whole life of a PR, in
  # exchange for CI on a branch that has no pull request open yet.
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer re-run CI against a branch by hand, from the Actions
  # tab. Added because there is no other way to: a force-push whose
  # `synchronize` event does not produce a run, or a pull_request whose base
  # was retargeted (the trigger above has no `types:`, so it covers
  # opened/synchronize/reopened only and a base change fires nothing), leaves
  # a head with no CI and no legitimate way to ask for it. The alternatives
  # are an empty commit or a close-and-reopen, both of which produce a green
  # tick without testing anything -- which is worse than no tick at all.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      # The schema's version-sensitive parts are the monthly-partitioned
      # audit log (apps/audit/migrations/0003) and the RLS policies
      # (apps/samples/migrations/0002, 0003).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Django will not boot without these. config/urls.py imports
      # django_auth_adfs.urls, which validates AUTH_ADFS at startup, so even
      # collecting tests fails when they are absent. No test performs a real
      # SSO handshake -- these values are never sent anywhere.
      AZURE_AD_TENANT_ID: 00000000-0000-0000-0000-000000000000
      AZURE_AD_CLIENT_ID: 00000000-0000-0000-0000-000000000000
      AZURE_AD_CLIENT_SECRET: ci-placeholder-not-a-real-secret
      DJANGO_SECRET_KEY: ci-placeholder-not-a-real-key
      DJANGO_DEBUG: 'false'

      POSTGRES_DB: nasat_lims
      POSTGRES_USER: nasat_lims
      POSTGRES_PASSWORD: devpassword
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'

      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

      OSS_BUCKET_NAME: nasat-lims-dev
      OSS_ENDPOINT: http://localhost:9000
      OSS_ACCESS_KEY_ID: minioadmin
      OSS_ACCESS_KEY_SECRET: minioadmin
      OSS_REGION: ap-southeast-6
      # MinIO's default config only recognises STANDARD/REDUCED_REDUNDANCY;
      # the AWS-standard enum values raise InvalidStorageClass. See the
      # module docstring in apps/audit/oss.py.
      OSS_ARCHIVE_STORAGE_CLASS: REDUCED_REDUNDANCY

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          # Both files: requirements-dev.txt is a thin "-r requirements.txt"
          # plus test tooling, so hashing it alone would keep serving a stale
          # cache after a runtime dependency changes.
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Create the application database role
        # Deliberately NOT a superuser and NOT BYPASSRLS: Postgres exempts
        # both from row-level security entirely. tests/test_row_level_security
        # .py asserts the policy holds against the raw DB connection rather
        # than through the ORM, so an over-privileged role here makes that
        # test fail with one customer reading another customer's orders --
        # a confusing failure that looks like a security regression in the
        # application. CREATEDB is required because pytest-django creates
        # test_nasat_lims itself.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE nasat_lims LOGIN PASSWORD 'devpassword' CREATEDB NOSUPERUSER NOBYPASSRLS;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE nasat_lims OWNER nasat_lims;"

      - name: Start MinIO
        # Not a service container: the official image needs a "server /data"
        # argument and the services: block has no way to supply a command.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become healthy in time"
          docker logs minio
          exit 1

      - name: Install WeasyPrint's system libraries
        # WeasyPrint links against Pango/cairo/GDK-PixBuf at import time, so
        # without these the backend job fails on `import weasyprint` rather
        # than on anything to do with the code. Installed explicitly rather
        # than relying on whatever the runner image happens to ship, since
        # that set changes between image releases.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-2.0-0 libcairo2

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Create the object storage bucket
        # test_audit_retention.py's real-OSS test calls head_object against
        # this bucket via apps/audit/oss.py; ensure_bucket() is the project's
        # own dev/test provisioning helper.
        working-directory: backend
        run: |
          python -c "
          import django, os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from apps.audit.oss import ensure_bucket
          ensure_bucket()
          "

      - name: Run tests
        working-directory: backend
        run: pytest

  image:
    name: Backend image (build + deploy check)
    runs-on: ubuntu-latest

    # Real Postgres and Redis, because the roles this job boots need them:
    # migrate applies a schema, and a Celery worker will not report ready
    # without a broker. The web-tier steps below deliberately run without
    # them, to prove liveness survives their absence.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Reached from inside a container, so the host rather than localhost.
      PGHOST: 172.17.0.1
      # The database credentials the roles below connect with. settings.py
      # defaults POSTGRES_PASSWORD to an empty string, so omitting it here
      # does not fall back to something workable -- it sends no password at
      # all and Postgres refuses the connection. The user and database
      # names match what the "Create the application database" step below
      # creates.
      DB_ENV: >-
        -e POSTGRES_HOST=127.0.0.1
        -e POSTGRES_PORT=5432
        -e POSTGRES_DB=nasat_lims
        -e POSTGRES_USER=nasat_lims
        -e POSTGRES_PASSWORD=devpassword
      COMMON_ENV: >-
        -e DJANGO_DEBUG=false
        -e DJANGO_SECRET_KEY=ci-boot-only-not-a-real-secret-but-long-enough-to-pass
        -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
        -e DJANGO_SECURE_SSL_REDIRECT=false
        -e AZURE_AD_TENANT_ID=00000000-0000-0000-0000-000000000000
        -e AZURE_AD_CLIENT_ID=00000000-0000-0000-0000-000000000000
        -e AZURE_AD_CLIENT_SECRET=ci-placeholder

    steps:
      - uses: actions/checkout@v7

      # Required for the GitHub Actions cache backend below. Without it,
      # buildx uses the default `docker` driver, which cannot export a
      # cache at all -- the build fails before reading the Dockerfile with
      # "Cache export is not supported for the docker driver". This action
      # sets up the docker-container driver, which supports both the cache
      # and `load: true`.
      - uses: docker/setup-buildx-action@v3

      # The point of this job. Nothing else in CI proves the application can
      # actually be packaged: the pytest job installs into the runner
      # directly, so a missing system library, a wheel that will not build,
      # or a collectstatic that fails would all go unnoticed until a deploy.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: nexuslims-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `check --deploy` inside the built image, with DEBUG off, which is
      # the configuration that actually ships. Run here rather than in the
      # pytest job because the pytest job runs with the test settings and
      # would not exercise the production branch of settings.py at all.
      - name: Django deployment checks
        run: |
          docker run --rm \
            -e DJANGO_DEBUG=false \
            -e DJANGO_SECRET_KEY=ci-check-only-not-a-real-secret-but-long-enough-to-pass \
            -e AZURE_AD_TENANT_ID=00000000-0000-0000-0000-000000000000 \
            -e AZURE_AD_CLIENT_ID=00000000-0000-0000-0000-000000000000 \
            -e AZURE_AD_CLIENT_SECRET=ci-placeholder \
            nexuslims-backend:ci \
            python manage.py check --deploy --fail-level WARNING

      # A container that starts is not the same as one that serves. This
      # boots gunicorn exactly as the image's CMD does and probes liveness,
      # which catches an import-time failure -- WeasyPrint's system
      # libraries being the likeliest -- that a build alone would not.
      - name: Boot the container and probe liveness
        run: |
          docker run -d --name nexuslims-ci -p 8000:8000 \
            -e NEXUSLIMS_MIGRATE_ON_START=false \
            $COMMON_ENV \
            nexuslims-backend:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz | grep -q '"ok"'; then
              echo "Container is live"
              docker rm -f nexuslims-ci > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become live in time"
          docker logs nexuslims-ci
          exit 1

      # /readyz with nothing to be ready for: no Postgres, no Redis. It must
      # answer 503 and name both, rather than hanging or raising -- a
      # readiness probe that cannot report a failure is worse than none,
      # because a deployment waits on it forever.
      - name: Readiness reports degraded without dependencies
        run: |
          docker run -d --name nexuslims-degraded -p 8001:8000 \
            -e NEXUSLIMS_MIGRATE_ON_START=false \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_PORT=1 \
            -e CELERY_BROKER_URL=redis://127.0.0.1:1/0 \
            $COMMON_ENV \
            nexuslims-backend:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -o /tmp/readyz.json -w '%{http_code}' http://localhost:8001/readyz || true)
            if [ "$code" = "503" ]; then
              cat /tmp/readyz.json
              grep -q '"database": "unavailable"' /tmp/readyz.json
              grep -q '"redis": "unavailable"' /tmp/readyz.json
              echo "Readiness correctly reported degraded"
              docker rm -f nexuslims-degraded > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Readiness did not report degraded (last code: $code)"
          docker logs nexuslims-degraded
          exit 1

      # From here on the roles that need a schema and a broker. This is the
      # half of the application that gunicorn does not run -- report PDF
      # generation, the retention sweep, the training capacity check -- and
      # until now nothing proved any of it could even start.
      - name: Create the application database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE nasat_lims LOGIN PASSWORD 'devpassword' CREATEDB NOSUPERUSER NOBYPASSRLS;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE nasat_lims OWNER nasat_lims;"

      - name: Migrations apply from the image
        run: |
          docker run --rm --network host \
            -e NEXUSLIMS_ROLE=migrate \
            $DB_ENV $COMMON_ENV \
            nexuslims-backend:ci

      # Twice, because a deploy runs this from every replica at once. The
      # second must be a clean no-op rather than a race, which is what the
      # advisory lock in deploy_migrate is for.
      - name: Migrations are safe to re-run
        run: |
          docker run --rm --network host \
            -e NEXUSLIMS_ROLE=migrate \
            $DB_ENV $COMMON_ENV \
            nexuslims-backend:ci 2>&1 | tee /tmp/second-migrate.log
          grep -q "No migrations to apply" /tmp/second-migrate.log

      - name: The Celery worker starts and answers a ping
        run: |
          docker run -d --name nexuslims-worker --network host \
            -e NEXUSLIMS_ROLE=worker \
            -e CELERY_BROKER_URL=redis://127.0.0.1:6379/0 \
            -e CELERY_RESULT_BACKEND=redis://127.0.0.1:6379/1 \
            $DB_ENV $COMMON_ENV \
            nexuslims-backend:ci
          # `inspect ping` over the broker, so this proves the worker is
          # consuming rather than merely that the process exists.
          for _ in $(seq 1 30); do
            if docker exec nexuslims-worker /app/docker-healthcheck.sh 2>/dev/null; then
              echo "Worker is consuming"
              docker rm -f nexuslims-worker > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Worker never answered a ping"
          docker logs nexuslims-worker
          exit 1

      - name: Celery beat starts and writes its schedule
        run: |
          docker run -d --name nexuslims-beat --network host \
            -e NEXUSLIMS_ROLE=beat \
            -e CELERY_BROKER_URL=redis://127.0.0.1:6379/0 \
            $DB_ENV $COMMON_ENV \
            nexuslims-backend:ci
          # What this step proves is that beat *boots and stays up* in the
          # image: Django imports, the broker connects, the scheduler
          # initialises and writes its file. That is the part no unit test
          # can reach.
          #
          # It deliberately does not assert which entries are scheduled.
          # tests/test_celery_beat_schedule.py already covers that, and
          # checking it here is not merely redundant, it cannot work: beat
          # persists entries only on sync or shutdown, so while it runs the
          # shelve is empty -- and gdbm holds an exclusive lock on it, so a
          # concurrent reader gets "Resource temporarily unavailable"
          # rather than an answer. Both were confirmed the hard way.
          for _ in $(seq 1 30); do
            if docker exec nexuslims-beat /app/docker-healthcheck.sh 2>/dev/null; then
              echo "Beat initialised its scheduler"
              # Still alive a few seconds later, so this is a running
              # scheduler rather than one about to crash-loop.
              sleep 5
              if [ "$(docker inspect -f '{{.State.Running}}' nexuslims-beat)" != "true" ]; then
                echo "Beat exited after starting"
                docker logs nexuslims-beat
                exit 1
              fi
              echo "Beat is still running"
              docker logs nexuslims-beat 2>&1 | tail -20
              docker rm -f nexuslims-beat > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Beat never wrote a schedule file"
          docker logs nexuslims-beat
          exit 1

  infra:
    name: Infra (terraform fmt + validate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The binary is fetched directly rather than via a setup action so the
      # version is pinned to something this repository chose, and so the job
      # has one fewer third-party dependency.
      - name: Install Terraform
        run: |
          curl -fsSL -o /tmp/terraform.zip \
            https://releases.hashicorp.com/terraform/1.15.9/terraform_1.15.9_linux_amd64.zip
          sudo unzip -oq /tmp/terraform.zip -d /usr/local/bin
          terraform version

      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -diff -recursive

      # `validate` is a schema check against the provider, not a call to
      # Alibaba, so it needs no credentials -- but it does need the provider
      # registry, which is why this runs here rather than being something a
      # developer can be relied on to have done. It is the check that catches
      # a resource or attribute that does not exist.
      - name: Validate
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate

  traceability:
    name: Traceability matrix (ISO/IEC 17025 7.11.2)
    runs-on: ubuntu-latest

    # Its own job rather than a step in `backend`, and stdlib-only so it needs
    # no dependencies and no database: the matrix is the evidence that every
    # requirement has a verifying test, and it is worth the most on the day
    # the application will not boot. A run that cannot install psycopg2 can
    # still answer "is the committed matrix what the source says".
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Fails when docs/traceability-matrix.md no longer matches the
      # requirement IDs in the source -- a new FR with no test, a test that
      # stopped citing one, a requirement deleted. Regenerate with
      # `cd backend && python tools/traceability.py --write`.
      - name: The committed matrix matches the source
        working-directory: backend
        run: python tools/traceability.py --check

  frontend:
    name: ${{ matrix.app }} (lint + test + typecheck + build)
    runs-on: ubuntu-latest

    strategy:
      # Report both frontends independently rather than hiding the second
      # failure behind the first.
      fail-fast: false
      matrix:
        app: [frontend, customer-portal]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vite 8 requires ^20.19 || >=22.12.
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      # npm ci, never npm install: it installs exactly what the lockfile
      # pins and never rewrites it. An npm older than the one that wrote
      # these lockfiles silently strips the libc fields from the
      # platform-specific optional binaries when it rewrites them.
      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npm run lint

      # Vitest + React Testing Library, jsdom. Runs before the build so a
      # behavioural regression is reported as a test failure rather than
      # hiding behind a later type error.
      - name: Test
        working-directory: ${{ matrix.app }}
        run: npm run test

      # "tsc -b && vite build": typecheck and production build in one script.
      # Covers the test files too, since they live under src/.
      - name: Typecheck and build
        working-directory: ${{ matrix.app }}
        run: npm run build
