<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="NexusLIMS">
  <title>NexusLIMS</title>
  <rect width="96" height="96" rx="22" fill="#06B6D4"/>
  <!-- Small-size variant of brand/nexuslims-mark.svg: flat fill, since a
       gradient is invisible at 16px and only costs contrast, and the glyph
       scaled up about 8% so the triangular counter stays open. -->
  <g transform="translate(48 48) scale(1.08) translate(-48 -48)">
    <g stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M48 30 L29 63"/>
      <path d="M48 30 L67 63"/>
      <path d="M29 63 L67 63"/>
    </g>
    <g fill="#fff">
      <circle cx="48" cy="30" r="10"/>
      <circle cx="29" cy="63" r="10"/>
      <circle cx="67" cy="63" r="10"/>
    </g>
  </g>
</svg>
